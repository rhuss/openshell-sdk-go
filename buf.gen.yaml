# Code generation for the Go SDK. buf compiles the proto module with its own
# compiler and runs protoc-gen-go / protoc-gen-go-grpc from mise-managed
# binaries. Limited to the client-surface closure (openshell, datamodel,
# sandbox, options, inference).
version: v2

inputs:
  - directory: proto
    paths:
      - proto/openshell.proto
      - proto/datamodel.proto
      - proto/sandbox.proto
      - proto/options.proto
      - proto/inference.proto

plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - module=github.com/rhuss/openshell-sdk-go
      - Mopenshell.proto=github.com/rhuss/openshell-sdk-go/proto/openshellv1
      - Mdatamodel.proto=github.com/rhuss/openshell-sdk-go/proto/datamodelv1
      - Msandbox.proto=github.com/rhuss/openshell-sdk-go/proto/sandboxv1
      - Moptions.proto=github.com/rhuss/openshell-sdk-go/proto/optionsv1
      - Minference.proto=github.com/rhuss/openshell-sdk-go/proto/inferencev1
  - local: protoc-gen-go-grpc
    out: .
    opt:
      - module=github.com/rhuss/openshell-sdk-go
      - Mopenshell.proto=github.com/rhuss/openshell-sdk-go/proto/openshellv1
      - Mdatamodel.proto=github.com/rhuss/openshell-sdk-go/proto/datamodelv1
      - Msandbox.proto=github.com/rhuss/openshell-sdk-go/proto/sandboxv1
      - Moptions.proto=github.com/rhuss/openshell-sdk-go/proto/optionsv1
      - Minference.proto=github.com/rhuss/openshell-sdk-go/proto/inferencev1
