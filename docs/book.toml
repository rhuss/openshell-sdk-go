[book]
title = "OpenShell Go SDK"
authors = ["NVIDIA Corporation"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/custom.css"]
git-repository-url = "https://github.com/rhuss/openshell-sdk-go"
edit-url-template = "https://github.com/rhuss/openshell-sdk-go/edit/main/docs/src/{path}"

[output.html.search]
enable = true
limit-results = 20
use-hierarchical-headings = true
